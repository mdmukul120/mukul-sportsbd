name: Cricket Lounge Scraper

on:
  schedule:
    # প্রতি ৫ মিনিট পরপর রান হবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

permissions:
  contents: write # গিটহাব রেপোতে লেখার অনুমতির জন্য

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add matches.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches.json" && git push)
